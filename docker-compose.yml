services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/scripts:/docker-entrypoint-initdb.d/scripts
      - ./postgres/20-create-database.sql:/docker-entrypoint-initdb.d/20-create-database.sql
    ports:
      - "5432:5432"
    command: >
      sh -c "
        docker-entrypoint.sh postgres &
        sleep 5
        psql -U postgres -c 'CREATE DATABASE tickets;'
        psql -U postgres -c 'CREATE DATABASE flights;' 
        psql -U postgres -c 'CREATE DATABASE bonus;'
        wait
      "

  bonus_service:
    container_name: bonus_service
    build:
      context: .  
      dockerfile: src/BonusService/Dockerfile  
    depends_on:
      - postgres
    ports:
      - "8050:8050"
  
  flight_service:
    container_name: flight_service
    build:
      context: . 
      dockerfile: src/FlightService/Dockerfile  
    depends_on:
      - postgres
    ports:
      - "8060:8060"
  
  ticket_service:
    container_name: ticket_service
    build:
      context: .  
      dockerfile: src/TicketService/Dockerfile 
    depends_on:
      - postgres
    ports:
      - "8070:8070"
  
  gateway_service:
    container_name: gateway_service
    build:
      context: . 
      dockerfile: src/GatewayService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  db-data:
