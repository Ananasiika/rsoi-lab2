services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privileges"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  bonus_service:
    container_name: bonus_service
    build:
      context: .  
      dockerfile: src/BonusService/Dockerfile  
    depends_on:
      - postgres
    ports:
      - "8050:8050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=privileges;Username=postgres;Password=postgres
  
  flight_service:
    container_name: flight_service
    build:
      context: . 
      dockerfile: src/FlightService/Dockerfile  
    depends_on:
      - postgres
    ports:
      - "8060:8060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=privileges;Username=postgres;Password=postgres
  
  ticket_service:
    container_name: ticket_service
    build:
      context: .  
      dockerfile: src/TicketService/Dockerfile 
    depends_on:
      - postgres
    ports:
      - "8070:8070"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=privileges;Username=postgres;Password=postgres
  
  gateway_service:
    container_name: gateway_service
    build:
      context: . 
      dockerfile: src/GatewayService/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  db-data:
