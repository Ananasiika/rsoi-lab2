services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  bonus_service:
    container_name: bonus_service
    build:
      context: .  
      dockerfile: src/BonusService/Dockerfile  
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3
    ports:
      - "8050:8050"

  flight_service:
    container_name: flight_service
    build:
      context: . 
      dockerfile: src/FlightService/Dockerfile  
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8060:8060"
      
  ticket_service:
    container_name: ticket_service
    build:
      context: .  
      dockerfile: src/TicketService/Dockerfile 
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8070:8070"
      
  gateway_service:
    container_name: gateway_service
    build:
      context: . 
      dockerfile: src/GatewayService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
