name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          sleep 20
          
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Check Tests
        timeout-minutes: 5
        run: |
          # Test Gateway endpoints
          echo "3. Testing Gateway endpoints:"
          
          # 3.1 Get flights via Gateway
          echo "3.1 Get flights via Gateway:"
          curl -v "http://localhost:8080/api/v1/flights?page=1&size=10" || echo "FAILED"
          
          # 3.2 Get privilege info
          echo "3.2 Get privilege info:"
          curl -v -H "X-User-Name: Test Max" "http://localhost:8080/api/v1/privilege" || echo "FAILED"
          
          # 3.3 Purchase ticket (main test)
          echo "3.3 Purchase ticket:"
          curl -v -X POST \
            -H "X-User-Name: Test Max" \
            -H "Content-Type: application/json" \
            -d '{"flightNumber":"AFL031","price":1500,"paidFromBalance":false}' \
            "http://localhost:8080/api/v1/tickets" || echo "FAILED"
          
          # Test direct service endpoints
          echo "4. Testing direct service endpoints:"
          
          # Flight Service
          echo "4.1 Flight Service direct:"
          curl -v "http://localhost:8060/api/v1/flights?page=1&size=10" || echo "FAILED"
          
          # Ticket Service
          echo "4.2 Ticket Service - get tickets:"
          curl -v -H "X-User-Name: Test Max" "http://localhost:8070/api/v1/tickets" || echo "FAILED"
          
          # Bonus Service  
          echo "4.3 Bonus Service - get privilege:"
          curl -v -H "X-User-Name: Test Max" "http://localhost:8050/api/v1/privilege" || echo "FAILED"
          
          echo "=== Database check ==="
          # Check if databases are initialized
          docker exec postgres psql -U postgres -d flights -c "SELECT * FROM flight;"
          docker exec postgres psql -U postgres -d tickets -c "SELECT * FROM ticket;"
          docker exec postgres psql -U postgres -d privileges -c "SELECT * FROM privilege;"

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
